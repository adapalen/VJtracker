<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="64" height="64" rx="16" fill="url(#cyberBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(6,182,212,0.35)" stroke-width="1.5"/>

  <!-- Minimalist Grid Lines -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="rgba(6,182,212,0.2)" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="rgba(6,182,212,0.2)" stroke-width="2" stroke-linecap="round"/>

  <!-- Token X (Top-Left) -->
  <path d="M 18 18 L 26 26 M 26 18 L 18 26" stroke="url(#violetGlow)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Token O (Bottom-Right) -->
  <circle cx="44" cy="44" r="5" fill="none" stroke="url(#cyanGlow)" stroke-width="3.5"/>
</svg>
