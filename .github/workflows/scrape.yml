name: Scrape Flights Daily
# Robust thrice-daily automated price crawler with conflict-free git merge

on:
  schedule:
    # Runs thrice daily at 1:00, 7:00, and 13:00 UTC (8:00 AM, 2:00 PM, and 8:00 PM ICT Vietnam Time)
    - cron: '0 1,7,13 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Scraper
        run: npm run scrape

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const dbPath = "p/VJtracker/flights_db.json";
            let localData = [];
            if (fs.existsSync(dbPath)) {
              try { localData = JSON.parse(fs.readFileSync(dbPath, "utf8")); } catch(e){}
            }
            try {
              const remoteRaw = execSync("git show origin/main:p/VJtracker/flights_db.json", { encoding: "utf8" });
              const remoteData = JSON.parse(remoteRaw);
              const remoteKeys = new Set(remoteData.map(r => r.crawlTimestamp + "_" + r.route + "_" + r.carrier + "_" + r.leadDays));
              const newRecords = localData.filter(r => !remoteKeys.has(r.crawlTimestamp + "_" + r.route + "_" + r.carrier + "_" + r.leadDays));
              console.log(`Merging ${newRecords.length} new records into latest remote flights_db.json...`);
              const merged = remoteData.concat(newRecords);
              execSync("git reset --hard origin/main");
              fs.writeFileSync(dbPath, JSON.stringify(merged, null, 2), "utf8");
            } catch(e) {
              console.log("Merge fallback:", e.message);
              try {
                execSync("git reset --hard origin/main");
                fs.writeFileSync(dbPath, JSON.stringify(localData, null, 2), "utf8");
              } catch(err) {}
            }
          '
          node scripts/generate-sitemap.js
          git add -A
          git commit -m "Auto-update flight prices: $(date)" || echo "No changes to commit"
          git push origin main
