<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161822"/>
      <stop offset="100%" stop-color="#0b0d13"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(245,158,11,0.25)" stroke-width="1.5"/>

  <!-- Serif Monogram 'A' -->
  <text x="32" y="47" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="42" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        filter="url(#glow)">A</text>
  
  <!-- Subtle decorative dot -->
  <circle cx="48" cy="18" r="3" fill="#38bdf8"/>
</svg>
